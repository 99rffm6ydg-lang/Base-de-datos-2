<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Flota PWA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA Manifest Inline Data -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Gestión Flota","short_name":"FlotaPWA","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#1e293b","icons":[{"src":"https://via.placeholder.com/192","sizes":"192x192","type":"image/png"}]}'>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-truck-front text-blue-500 text-2xl"></i>
            <h1 class="font-bold text-lg tracking-wide text-white">Gestión de Flota</h1>
        </div>
        <span id="status-tag" class="text-xs px-2 py-1 bg-green-500/20 text-green-400 border border-green-500/30 rounded-full flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> Local Active
        </span>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- Tab: Remisiones / Salidas -->
        <section id="tab-remisiones" class="tab-content space-y-4">
            <h2 class="text-xl font-bold text-blue-400 flex items-center gap-2">
                <i class="fa-solid fa-file-contract"></i> Registrar Remisión / Salida
            </h2>
            <form id="form-remision" class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Vehículo / Unidad</label>
                    <input type="text" id="rem-unidad" required placeholder="Ej. Camión 01 - ABC-123" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Conductor</label>
                    <input type="text" id="rem-conductor" required placeholder="Nombre del chofer" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Detalle de Carga / Destino</label>
                    <textarea id="rem-detalle" required rows="2" placeholder="Notas sobre el envío o destino..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Evidencia Fotográfica</label>
                    <input type="file" id="rem-foto" accept="image/*" capture="environment" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg shadow-md transition-all active:scale-98">
                    Guardar Remisión
                </button>
            </form>

            <div class="space-y-3">
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Historial Reciente</h3>
                <div id="lista-remisiones" class="space-y-2"></div>
            </div>
        </section>

        <!-- Tab: Mantenimiento -->
        <section id="tab-mantenimiento" class="tab-content hidden space-y-4">
            <h2 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-wrench"></i> Registro de Mantenimiento
            </h2>
            <form id="form-mantenimiento" class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Vehículo / Unidad</label>
                    <input type="text" id="mant-unidad" required placeholder="Ej. Camión 02" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Tipo Servicio</label>
                        <select id="mant-tipo" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-500">
                            <option value="Preventivo">Preventivo</option>
                            <option value="Correctivo">Correctivo</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Costo Est. ($)</label>
                        <input type="number" id="mant-costo" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Descripción del Trabajo</label>
                    <textarea id="mant-desc" required rows="2" placeholder="Cambio de aceite, frenos, etc..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 rounded-lg shadow-md transition-all active:scale-98">
                    Registrar Mantenimiento
                </button>
            </form>

            <div class="space-y-3">
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Mantenimientos Registrados</h3>
                <div id="lista-mantenimientos" class="space-y-2"></div>
            </div>
        </section>

        <!-- Tab: Inventario / Flota -->
        <section id="tab-inventario" class="tab-content hidden space-y-4">
            <h2 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
                <i class="fa-solid fa-boxes-stacked"></i> Estado de la Flota / Equipos
            </h2>
            <form id="form-inventario" class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nombre de Equipo / Pieza</label>
                    <input type="text" id="inv-nombre" required placeholder="Ej. Llantas 295/80 R22.5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Cantidad</label>
                        <input type="number" id="inv-cant" required placeholder="1" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Estado</label>
                        <select id="inv-estado" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
                            <option value="Nuevo">Nuevo / Excelente</option>
                            <option value="Usado">Usado / Funcional</option>
                            <option value="Dañado">Requiere Cambio</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg shadow-md transition-all active:scale-98">
                    Agregar al Inventario
                </button>
            </form>

            <div class="space-y-3">
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Inventario Actual</h3>
                <div id="lista-inventario" class="space-y-2"></div>
            </div>
        </section>

    </main>

    <!-- Navigation Bar (Bottom) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 flex justify-around py-2 z-50">
        <button onclick="switchTab('remisiones')" id="nav-remisiones" class="flex flex-col items-center text-blue-400 text-xs font-medium">
            <i class="fa-solid fa-file-contract text-lg mb-0.5"></i>
            <span>Remisiones</span>
        </button>
        <button onclick="switchTab('mantenimiento')" id="nav-mantenimiento" class="flex flex-col items-center text-slate-400 text-xs font-medium hover:text-slate-200">
            <i class="fa-solid fa-wrench text-lg mb-0.5"></i>
            <span>Taller</span>
        </button>
        <button onclick="switchTab('inventario')" id="nav-inventario" class="flex flex-col items-center text-slate-400 text-xs font-medium hover:text-slate-200">
            <i class="fa-solid fa-boxes-stacked text-lg mb-0.5"></i>
            <span>Inventario</span>
        </button>
    </nav>

    <!-- Logic Script & Dynamic Service Worker -->
    <script>
        // Registrar Service Worker Inline para funcionalidad Offline
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'pwa-flota-v1';
                self.addEventListener('install', e => {
                    e.waitUntil(
                        caches.open(CACHE_NAME).then(cache => {
                            return cache.addAll(['./']);
                        })
                    );
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(
                        caches.match(e.request).then(response => response || fetch(e.request))
                    );
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(() => {});
        }

        // Keys
        const STORAGE_REM = 'pwa_flota_remisiones';
        const STORAGE_MANT = 'pwa_flota_mantenimiento';
        const STORAGE_INV = 'pwa_flota_inventario';

        // Tab Navigation
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('text-blue-400', 'text-amber-400', 'text-emerald-400');
                el.classList.add('text-slate-400');
            });

            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            const activeNav = document.getElementById(`nav-${tab}`);
            
            if(tab === 'remisiones') activeNav.classList.add('text-blue-400');
            if(tab === 'mantenimiento') activeNav.classList.add('text-amber-400');
            if(tab === 'inventario') activeNav.classList.add('text-emerald-400');
        }

        // Compresión de fotos para evitar saturar localStorage en iPhone
        function compressAndGetBase64(file) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }

        // Remisiones Submit
        document.getElementById('form-remision').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const fotoFile = document.getElementById('rem-foto').files[0];
                const fotoBase64 = await compressAndGetBase64(fotoFile);

                const item = {
                    id: Date.now(),
                    unidad: document.getElementById('rem-unidad').value,
                    conductor: document.getElementById('rem-conductor').value,
                    detalle: document.getElementById('rem-detalle').value,
                    foto: fotoBase64,
                    fecha: new Date().toLocaleString('es-MX')
                };

                const data = JSON.parse(localStorage.getItem(STORAGE_REM) || '[]');
                data.unshift(item);
                localStorage.setItem(STORAGE_REM, JSON.stringify(data));
                e.target.reset();
                renderRemisiones();
            } catch (err) {
                alert('Error de almacenamiento. Intente sin foto o borre registros antiguos.');
            }
        });

        // Mantenimiento Submit
        document.getElementById('form-mantenimiento').addEventListener('submit', (e) => {
            e.preventDefault();
            const item = {
                id: Date.now(),
                unidad: document.getElementById('mant-unidad').value,
                tipo: document.getElementById('mant-tipo').value,
                costo: document.getElementById('mant-costo').value || '0',
                desc: document.getElementById('mant-desc').value,
                fecha: new Date().toLocaleDateString('es-MX')
            };

            const data = JSON.parse(localStorage.getItem(STORAGE_MANT) || '[]');
            data.unshift(item);
            localStorage.setItem(STORAGE_MANT, JSON.stringify(data));
            e.target.reset();
            renderMantenimientos();
        });

        // Inventario Submit
        document.getElementById('form-inventario').addEventListener('submit', (e) => {
            e.preventDefault();
            const item = {
                id: Date.now(),
                nombre: document.getElementById('inv-nombre').value,
                cant: document.getElementById('inv-cant').value,
                estado: document.getElementById('inv-estado').value
            };

            const data = JSON.parse(localStorage.getItem(STORAGE_INV) || '[]');
            data.unshift(item);
            localStorage.setItem(STORAGE_INV, JSON.stringify(data));
            e.target.reset();
            renderInventario();
        });

        // Renderers
        function renderRemisiones() {
            const data = JSON.parse(localStorage.getItem(STORAGE_REM) || '[]');
            const container = document.getElementById('lista-remisiones');
            container.innerHTML = data.length === 0 ? '<p class="text-xs text-slate-500 italic">No hay remisiones registradas.</p>' : '';
            
            data.forEach(item => {
                container.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700 p-3 rounded-lg text-xs space-y-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="font-bold text-blue-400 text-sm">${item.unidad}</span>
                                <p class="text-slate-300">Chofer: ${item.conductor}</p>
                            </div>
                            <span class="text-slate-500">${item.fecha}</span>
                        </div>
                        <p class="text-slate-400">${item.detalle}</p>
                        ${item.foto ? `<img src="${item.foto}" class="w-full h-32 object-cover rounded-md border border-slate-700 mt-2">` : ''}
                    </div>
                `;
            });
        }

        function renderMantenimientos() {
            const data = JSON.parse(localStorage.getItem(STORAGE_MANT) || '[]');
            const container = document.getElementById('lista-mantenimientos');
            container.innerHTML = data.length === 0 ? '<p class="text-xs text-slate-500 italic">Sin mantenimientos registrados.</p>' : '';
            
            data.forEach(item => {
                container.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700 p-3 rounded-lg text-xs space-y-1">
                        <div class="flex justify-between">
                            <span class="font-bold text-amber-400 text-sm">${item.unidad}</span>
                            <span class="px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">${item.tipo}</span>
                        </div>
                        <p class="text-slate-300">${item.desc}</p>
                        <div class="flex justify-between text-slate-500 pt-1">
                            <span>Costo: $${item.costo}</span>
                            <span>${item.fecha}</span>
                        </div>
                    </div>
                `;
            });
        }

        function renderInventario() {
            const data = JSON.parse(localStorage.getItem(STORAGE_INV) || '[]');
            const container = document.getElementById('lista-inventario');
            container.innerHTML = data.length === 0 ? '<p class="text-xs text-slate-500 italic">Inventario vacío.</p>' : '';
            
            data.forEach(item => {
                container.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700 p-3 rounded-lg text-xs flex justify-between items-center">
                        <div>
                            <span class="font-bold text-emerald-400 text-sm">${item.nombre}</span>
                            <p class="text-slate-400">Estado: ${item.estado}</p>
                        </div>
                        <span class="text-base font-bold bg-slate-900 px-3 py-1 rounded-lg border border-slate-700 text-slate-200">x${item.cant}</span>
                    </div>
                `;
            });
        }

        // Init
        renderRemisiones();
        renderMantenimientos();
        renderInventario();
    </script>
</body>
</html>
